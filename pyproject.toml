[project]
name = "myday-agent"
version = "0.1.0"
description = "Self-hosted personal AI assistant on Telegram, built as an AI engineering learning project"
license = { text = "MIT" }
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
